.skill-modal-art.illustrated{height:190px;overflow:hidden;border:1px solid #387b8b;border-radius:12px;background:#081621}
.skill-modal-art.illustrated img{width:100%;height:100%;object-fit:contain}

/* 0.3.7 day selection art: only selection cards, never form fields */
.day-photo{position:relative;min-height:172px;border:1px solid #34768b;border-radius:17px;overflow:hidden;background:#0b1d2a;margin:12px 0}
.day-photo .day-photo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.day-photo .day-photo-shade{position:absolute;inset:0;background:linear-gradient(90deg,#06131de8,#06131d88 55%,#06131d55),linear-gradient(0deg,#06131dd9,transparent 70%)}
.day-photo .day-photo-content{position:relative;z-index:1;min-height:172px;display:flex;flex-direction:column;justify-content:space-between;padding:16px}
.day-photo h2{font-size:22px;text-shadow:0 2px 12px #000;margin:6px 0}
.day-photo .day-photo-actions{display:flex;flex-wrap:wrap;gap:7px}
.day-photo .btn{backdrop-filter:blur(9px);background:#0c2839dd}
.day-photo .btn.primary{background:#65dce9;color:#07151b}
.day-photo .muted{color:#c6dce5}
.theme-preview{height:150px;border:1px solid #396579;border-radius:12px;background:#0b1d2a;overflow:hidden;position:relative;margin:10px 0}
.theme-preview img{width:100%;height:100%;object-fit:cover}
.theme-preview:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#071723aa,transparent)}

/* 0.3.8: cool-toned unified athlete imagery and clean day-edit mode */
.skill-card-image img,.matrix-art.illustrated img,.skill-modal-art.illustrated img{filter:grayscale(1) sepia(.65) hue-rotate(155deg) saturate(2.1) contrast(1.12);object-position:center;}

.day-photo[role="button"]{cursor:pointer}
.day-photo[role="button"]:focus-visible{outline:3px solid #8bf5ff;outline-offset:3px}
.line>.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

function setValue(ei,si,k,v){db.draft.exercises[ei].sets[si][k]=v;save()}

function copySet(ei){let e=db.draft.exercises[ei],idx=e.sets.findIndex(s=>!s.done);if(idx<0)return toast('All sets already completed');let src=e.sets[idx-1];if(!src)return toast('Complete a set first');e.sets[idx].weight=src.weight;e.sets[idx].reps=src.reps;save();workout();toast('Previous set copied')}
function addSet(ei){let e=db.draft.exercises[ei],last=e.sets.at(-1);e.sets.push({weight:last?.weight||'',reps:'',done:false,missed:false});save();workout()}function removeSet(ei){let e=db.draft.exercises[ei];if(e.sets.length<=1)return;e.sets.pop();save();workout()}
function markMissed(ei){let e=db.draft.exercises[ei],s=e.sets.find(x=>!x.done);if(!s)return toast('No incomplete set');s.missed=true;s.done=true;save();workout();toast('Missed target recorded')}
function guide(ei){let e=db.draft.exercises[ei];modal(`<div class="eyebrow">EXERCISE GUIDE</div><h2>${esc(e.name)}</h2><p class="muted">${esc(e.instructions||'Control the movement, maintain stable positioning, and avoid painful ranges.')}</p><div class="note">Movement: ${esc(e.pattern)} · Target: ${esc(e.repsTarget)}. Stop if you experience unusual pain.</div><button class="btn primary full" onclick="closeModal()">Got it</button>`)}
function swap(ei){let e=db.draft.exercises[ei],options=catalog.filter(c=>c[1]===e.pattern&&c[0]!==e.name);modal(`<div class="eyebrow">MOVEMENT SELECTOR</div><h2>Replace ${esc(e.name)}</h2><p class="muted small">Similar movement pattern: ${esc(e.pattern)}. Your completed sets stay unchanged until you confirm a replacement.</p><div class="stack">${options.map(c=>`<button class="swap-card" onclick="applySwap(${ei},${catalog.indexOf(c)})"><span class="swap-symbol">↗</span><span><b>${esc(c[0])}</b><small>${esc(c[2])} · ${esc(c[4])} reps</small></span><span class="muted">›</span></button>`).join('')||'<p class="muted">No built-in alternatives for this movement pattern yet.</p>'}</div><button class="btn ghost full" onclick="closeModal()">Cancel</button>`)}
function applySwap(ei,ci){let e=db.draft.exercises[ei],c=catalog[ci];if(!c)return;let completed=e.sets.some(s=>s.done);if(completed&&!confirm('This exercise has completed sets. Replace it anyway? The completed sets will be discarded.'))return;let old=e.name,x=makeEx(c[0]);e.name=x.name;e.pattern=x.pattern;e.muscle=x.muscle;e.instructions=x.instructions;e.repsTarget=x.reps;e.rest=x.rest;e.sets=e.sets.map((s,i)=>({weight:latestWeight(x.name,i),reps:'',done:false,missed:false}));db.draft.swaps=db.draft.swaps||[];db.draft.swaps.push({original:old,replacement:x.name,exerciseId:e.id});save();closeModal();workout();toast('Swapped for this session')}
function finishWorkout(){let d=db.draft,done=d.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);if(!done)return toast('Complete at least one set');if(!confirm(`Save this workout with ${done} completed or missed sets?`))return;ensureTiming(d);d.timing.durationMs=d.backdated?d.manualDurationMs:sessionElapsed(d);d.timing.finishedAt=Date.now();db.logs.push(structuredClone(d));lastSavedLog=d.id;db.draft=null;save();timerEnd=0;timerRemain=0;page='summary';activeDay=null;render();toast('Workout saved');celebrateMilestones(d);if(d.swaps?.length)swapDecision(d)}
function discardDraft(){if(!confirm('Discard the unfinished workout?'))return;db.draft=null;save();go('train')}
function completedSets(name){return db.logs.flatMap(l=>(l.exercises||[]).filter(e=>e.name===name).flatMap(e=>(e.sets||[]).filter(s=>s.done&&!s.missed).map(s=>({weight:Number(s.weight)||0,reps:Number(s.reps)||0,date:l.workoutDate||l.date,day:l.dayName})))).filter(s=>s.reps>0)}
function allExerciseNames(){return [...new Set([...db.days.flatMap(d=>d.ex.map(e=>e.name)),...db.logs.flatMap(l=>(l.exercises||[]).map(e=>e.name))])].sort()}
function best(name,metric){let sets=completedSets(name);return sets.length?Math.max(...sets.map(s=>metric==='reps'?s.reps:metric==='volume'?s.weight*s.reps:s.weight)):0}
function targetTop(str){let a=String(str||'').match(/\d+/g);return a?Number(a.at(-1)):null}
function suggestion(e){let sessions=db.logs.filter(l=>l.exercises?.some(x=>x.name===e.name));let recent=sessions.sort((a,b)=>dateOnly(a.workoutDate||a.date).localeCompare(dateOnly(b.workoutDate||b.date))||String(a.date).localeCompare(String(b.date))).slice(-2);if(recent.length<2)return 'Log two sessions to unlock a progression suggestion.';let top=targetTop(e.reps);if(!top)return 'No numeric rep target set.';let ok=recent.every(l=>{let x=l.exercises.find(x=>x.name===e.name);return x&&x.sets.length&&x.sets.every(s=>s.done&&!s.missed&&Number(s.reps)>=top)});return ok?'You reached the top of your rep range in two sessions. Consider a small weight increase next time, if form feels solid.':'Keep your current load and work toward the top of your rep range with good form.'}
function miniChart(name){let demo=!!db.settings.demoMode;let vals=demo?demoSessions(name):db.logs.flatMap(l=>{let x=l.exercises?.find(e=>e.name===name);let weights=(x?.sets||[]).filter(s=>s.done&&!s.missed&&Number.isFinite(Number(s.weight))&&Number(s.weight)>0).map(s=>Number(s.weight));return weights.length?[{date:dateOnly(l.workoutDate||l.date),weight:Math.max(...weights),id:l.id}]:[]}).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id))).slice(-12);if(!vals.length)return '<p class="muted small">No completed weighted sets yet. Log a session or enable Demo Mode.</p>';let max=Math.max(1,...vals.map(x=>x.weight));let pts=vals.map((v,i)=>`${vals.length===1?160:16+i*288/(vals.length-1)},${112-v.weight/max*90}`).join(' ');return `<svg class="trend" viewBox="0 0 320 140" role="img" aria-label="Top logged weight by session for ${esc(name)}">${'<path d="M16 115H304" stroke="#365767"/>'}${vals.length>1?`<polyline points="${pts}" fill="none" stroke="#6ce7f4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}${vals.map((v,i)=>`<circle cx="${vals.length===1?160:16+i*288/(vals.length-1)}" cy="${112-v.weight/max*90}" r="5" fill="#77e9c3"/>`).join('')}<text x="16" y="133" fill="#91b3c1" font-size="10">${esc(vals[0].date.slice(5))}</text><text x="304" y="133" text-anchor="end" fill="#91b3c1" font-size="10">${esc(vals.at(-1).date.slice(5))}</text></svg><p class="muted small">${demo?'DEMO DATA — not saved · ':''}${vals.length} session${vals.length===1?'':'s'} · highest completed weight (lb) · same-day sessions included</p>`}
function localDate(ts=Date.now()){let d=new Date(ts);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateOnly(value){return /^\d{4}-\d{2}-\d{2}$/.test(String(value||''))?value:String(value||'').slice(0,10)}
function validWorkoutDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;let d=new Date(value+'T12:00:00');return !isNaN(d)&&localDate(d.getTime())===value&&value<=localDate()}
function displayWorkoutDate(l){return new Date(dateOnly(l.workoutDate||l.date)+'T12:00:00').toLocaleDateString()}
function editLogDate(id){let l=db.logs.find(x=>x.id===id);if(!l)return;modal(`<h2>Change workout date</h2><p class="muted small">This changes the training date used in history, weekly goals and charts. It does not change when the workout was saved.</p><label>Workout date</label><input class="field" id="edit-log-date" type="date" max="${localDate()}" value="${dateOnly(l.workoutDate||l.date)}"><button class="btn primary full" onclick="saveLogDate('${id}')">Save date</button><button class="btn ghost full" onclick="closeModal()">Cancel</button>`)}
function saveLogDate(id){let l=db.logs.find(x=>x.id===id),v=$('#edit-log-date')?.value;if(!l||!validWorkoutDate(v))return toast('Choose a valid date, not in the future');l.workoutDate=v;save();closeModal();if(page==='summary')summary(id);else progress();toast('Workout date updated')}
function setDraftDate(v){if(!db.draft||!validWorkoutDate(v))return toast('Choose a valid date, not in the future');db.draft.workoutDate=v;db.draft.backdated=v!==localDate();if(db.draft.backdated&&db.draft.timing){db.draft.timing.durationMs=null}save();workout()}
function changeDraftDuration(v){if(!db.draft)return;let n=v===''?null:Number(v);if(n!==null&&(!Number.isFinite(n)||n<0||n>1440))return toast('Enter 0–1440 minutes');db.draft.manualDurationMs=n===null?null:Math.round(n*60000);save()}
function demoSessions(name){let base=Date.now();return [65,70,70,75,80,85].map((v,i)=>({date:new Date(base-(5-i)*86400000).toISOString(),weight:v,session:i+1}))}
function toggleDemo(){db.settings.demoMode=!db.settings.demoMode;save();progress()}

function progress(){db.goals=db.goals||[];let names=allExerciseNames(),selected=db.settings.chartExercise||names[0]||'',sessions=db.logs.length;let goalCards=db.goals.map(g=>{let value=best(g.exercise,g.metric),pct=Math.min(100,Math.round(100*value/g.target)),met=value>=g.target;return `<section class="panel"><div class="line"><div><b>${esc(g.exercise)}</b><p class="muted small">${g.metric==='reps'?'Repetitions':g.metric==='volume'?'Set volume (lb)':'Top weight (lb)'} · ${value} / ${g.target}</p></div><button class="btn slim ghost" onclick="removeGoal('${g.id}')">Remove</button></div><div class="progress"><i style="width:${pct}%"></i></div>${met?'<div class="achievement">✦ GOAL REACHED</div>':''}</section>`}).join('');let recs=db.days.flatMap(d=>d.ex).filter((e,i,a)=>a.findIndex(x=>x.name===e.name)===i).slice(0,12);shell('PROGRESSION','0.2.1 ALPHA',`<div class="two"><section class="panel"><div class="eyebrow">WORKOUTS</div><h1>${sessions}</h1></section><section class="panel"><div class="eyebrow">ACTIVE GOALS</div><h1>${db.goals.length}</h1></section></div><section class="panel"><div class="line"><h2>Strength trend</h2><span class="tag">LOGGED WEIGHT</span></div><label><input type="checkbox" ${db.settings.demoMode?'checked':''} onchange="toggleDemo()"> Demo Mode — sample chart only</label><p class="muted small">Demo data is visual-only and never changes your goals, PRs or history.</p><label for="chart-ex">Exercise</label><select class="field" id="chart-ex" onchange="selectChart(this.value)">${names.map(n=>`<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}</select>${selected?miniChart(selected):'<p class="muted">No exercises available yet.</p>'}<p class="muted small">This chart shows your actual recorded weights, not estimated one-rep maxes.</p></section><div class="line"><h2>Personal goals</h2><button class="btn slim primary" onclick="addGoalDialog()">+ Add goal</button></div>${goalCards||'<div class="empty">Choose an exercise and set a target. Goals never change your workouts automatically.</div>'}<h2>Personal records</h2>${names.filter(n=>completedSets(n).length).map(n=>`<div class="panel compact line"><b>${esc(n)}</b><span class="muted small">${best(n,'weight')} lb · ${best(n,'reps')} reps</span></div>`).join('')||'<div class="empty">Your records will appear after you complete a workout.</div>'}<h2>Progression coach</h2><p class="muted small">Suggestions only. You decide whether to change anything.</p>${recs.map(e=>`<section class="panel compact"><b>${esc(e.name)}</b><p class="muted small">${esc(suggestion(e))}</p></section>`).join('')}<h2>Workout history</h2>${db.logs.length?[...db.logs].sort((a,b)=>dateOnly(b.workoutDate||b.date).localeCompare(dateOnly(a.workoutDate||a.date))||String(b.date).localeCompare(String(a.date))).map(l=>`<div class="panel"><div class="line"><div><b>${esc(l.dayName)}</b><div class="muted small">${displayWorkoutDate(l)} · ${l.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)} sets · ${durationText(l.timing?.durationMs)}</div></div><div class="actions"><button class="btn slim ghost" onclick="summary('${l.id}')">Details</button><button class="btn slim ghost" onclick="editLogDate('${l.id}')">Edit date</button><button class="btn slim danger" onclick="deleteLog('${l.id}')">Delete</button></div></div></div>`).join(''):'<div class="empty">No sessions yet.</div>'}`)}
function selectChart(name){db.settings.chartExercise=name;save();progress()}
function addGoalDialog(){let names=allExerciseNames();modal(`<h2>New fitness goal</h2><p class="muted small">Track a personal best against your own target. You control all training changes.</p><label>Exercise</label><select id="goal-ex" class="field">${names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select><label>Measure</label><select id="goal-metric" class="field"><option value="weight">Highest weight (lb)</option><option value="reps">Most reps in a set</option><option value="volume">Weight × reps (lb)</option></select><label>Target</label><input id="goal-target" class="field" type="number" min="1" step="1" placeholder="e.g. 225"><button class="btn primary full" onclick="saveGoal()">Save goal</button><button class="btn ghost full" onclick="closeModal()">Cancel</button>`)}
function saveGoal(){let exercise=$('#goal-ex')?.value,metric=$('#goal-metric')?.value,target=Number($('#goal-target')?.value);if(!exercise||!['weight','reps','volume'].includes(metric)||!Number.isFinite(target)||target<=0||target>1000000)return toast('Enter a valid positive target');db.goals=db.goals||[];db.goals.push({id:uid(),exercise,metric,target});save();closeModal();progress();toast('Goal added')}
function removeGoal(id){if(!confirm('Remove this goal? Workout history stays intact.'))return;db.goals=db.goals.filter(g=>g.id!==id);save();progress()}
function celebrateMilestones(log){let hits=(db.goals||[]).filter(g=>best(g.exercise,g.metric)>=g.target&&!(db.celebrated||[]).includes(g.id));if(hits.length){db.celebrated=db.celebrated||[];db.celebrated.push(...hits.map(g=>g.id));save();setTimeout(()=>modal(`<div class="eyebrow">PHOENIX // MILESTONE UNLOCKED</div><h2>Goal achieved!</h2>${hits.map(g=>`<div class="achievement">✦ ${esc(g.exercise)} · ${g.target} ${g.metric==='reps'?'reps':'lb'}</div>`).join('')}<button class="btn primary full" onclick="closeModal()">Continue</button>`),350)}}
function deleteLog(id){if(!confirm('Delete this workout log? This cannot be undone.'))return;db.logs=db.logs.filter(l=>l.id!==id);save();progress();toast('Log deleted')}
function more(){shell('SETTINGS','LOCAL-FIRST',`<section class="panel"><h2>Training preferences</h2><label><input type="checkbox" ${db.settings.city!==false?'checked':''} onchange="setting('city',this.checked)"> Neon City background</label><div class="divider"></div><label><input type="checkbox" ${db.settings.autoTimer?'checked':''} onchange="setting('autoTimer',this.checked)"> Start rest timer when a set is completed</label><div class="divider"></div><label><input type="checkbox" ${db.settings.sessionTimer!==false?'checked':''} onchange="setting('sessionTimer',this.checked)"> Show session duration during workouts</label><div class="divider"></div><label><input type="checkbox" ${db.settings.rain?'checked':''} onchange="setting('rain',this.checked)"> Subtle rain atmosphere</label></section><section class="panel"><h2>Exercise library</h2><p class="muted small">Add a custom exercise to your current program from the day editor.</p><button class="btn full" onclick="go('train')">Manage workout days</button></section><section class="panel"><h2>Progress & Goals</h2><button class="btn full" onclick="go('progress')">Open Progress dashboard</button></section><section class="panel"><h2>Backups</h2><p class="muted small">Your data stays in this browser on this device. Export backups regularly. Importing replaces all current alpha data after confirmation.</p><button class="btn full" onclick="exportData()">Export JSON backup</button><div style="height:9px"></div><label class="btn full" style="text-align:center">Import JSON backup<input type="file" accept="application/json,.json" hidden onchange="importData(this)"></label></section><section class="panel"><h2>Program snapshots</h2><p class="muted small">Up to 25 previous workout-program layouts are retained locally.</p>${db.snapshots.length?db.snapshots.map((s,i)=>`<div class="line compact"><span class="small">${new Date(s.date).toLocaleString()} · ${s.days.length} days</span><button class="btn slim ghost" onclick="restoreSnapshot(${i})">Restore</button></div>`).join(''):'<p class="muted small">Your first program edit creates a snapshot.</p>'}</section><div class="note">Alpha scope: holographic pose diagrams are illustrative; full exercise-specific technique artwork and install testing remain future work.</div>`)}
function setting(k,v){db.settings[k]=v;save();if(k==='rain')document.body.classList.toggle('quiet',!v);if(k==='city'){document.body.classList.toggle('city-on',v);document.body.classList.toggle('city-off',!v)}}function exportData(){let blob=new Blob([JSON.stringify({app:'Phoenix Fitness',version:'0.3.7',data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='phoenix-fitness-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
async function importData(input){let file=input.files?.[0];if(!file)return;try{let j=JSON.parse(await file.text());if(j.app!=='Phoenix Fitness'||!['0.1.0','0.1.1','0.2.0','0.2.1','0.3.0','0.3.2','0.3.7'].includes(j.version)||!j.data||j.data.schema!==1||!Array.isArray(j.data.days)||!Array.isArray(j.data.logs)||!j.data.settings)throw Error('Not a valid Phoenix Fitness Alpha backup');if(!confirm('Replace ALL current alpha data with this backup? Export your current data first if you need it.'))return;db=j.data;save();go('home');toast('Backup restored')}catch(e){alert('Import rejected: '+e.message)}input.value=''}
function restoreSnapshot(i){let s=db.snapshots[i];if(!s||!confirm('Restore this workout program? Existing workout history remains unchanged.'))return;snapshot();db.days=structuredClone(s.days);save();more();toast('Program restored')}
function modal(html){$('#modal').innerHTML=`<div class="modal"><div class="sheet">${html}</div></div>`}function closeModal(){$('#modal').innerHTML=''}
// Day exercise editing, including a small built-in movement library and custom names.
const oldEdit=editDay;editDay=function(id){let d=db.days.find(x=>x.id===id);if(!d)return;modal(`<div class="eyebrow">PROGRAM EDITOR</div><h2>${esc(d.name)}</h2><label>Day name</label><input class="field" id="dn" value="${esc(d.name)}"><p><label><input type="checkbox" id="dr" ${d.required?'checked':''}> Required weekly day</label></p><button class="btn primary full" onclick="saveDayEdit('${id}')">Save day settings</button><button class="btn full" onclick="themeEditor('${id}')">Customize day background</button><div class="divider"></div><h3>Exercises</h3>${d.ex.map((e,i)=>`<div class="rowedit compact"><span class="small">${esc(e.name)} <span class="muted">${e.sets} sets</span></span><button class="btn slim ghost" onclick="editExercise('${id}',${i})">Edit</button><button class="btn slim danger" onclick="removeExercise('${id}',${i})">×</button></div>`).join('')}<div class="divider"></div><button class="btn full" onclick="chooseExercise('${id}')">+ Add exercise</button><button class="btn ghost full" onclick="closeModal()">Close</button>`)};
function chooseExercise(id){modal(`<h2>Add exercise</h2><label>Choose from library</label><select id="lib" class="field">${catalog.map(c=>`<option value="${esc(c[0])}">${esc(c[0])} · ${esc(c[1])}</option>`).join('')}</select><button class="btn primary full" style="margin-top:12px" onclick="addExercise('${id}')">Add selected exercise</button><div class="divider"></div><label>Or create a custom exercise</label><input id="custom" class="field" placeholder="Custom exercise name"><button class="btn full" style="margin-top:10px" onclick="addExercise('${id}',true)">Create custom</button><button class="btn ghost full" onclick="editDay('${id}')">Back</button>`)}
function addExercise(id,custom=false){let name=custom?$('#custom').value.trim():$('#lib').value;if(!name)return toast('Enter a name');snapshot();db.days.find(x=>x.id===id).ex.push(makeEx(name));save();editDay(id)}
function removeExercise(id,i){if(!confirm('Remove this exercise from the plan? Past workout logs stay intact.'))return;snapshot();db.days.find(x=>x.id===id).ex.splice(i,1);save();editDay(id)}
function editExercise(id,i){let e=db.days.find(x=>x.id===id).ex[i];modal(`<h2>Edit exercise</h2><label>Name</label><input class="field" id="en" value="${esc(e.name)}"><div class="two"><div><label>Sets</label><input class="field" id="es" type="number" min="1" max="12" value="${e.sets}"></div><div><label>Rep target</label><input class="field" id="er" value="${esc(e.reps)}"></div></div><div class="two"><div><label>Rest (seconds)</label><input class="field" id="et" type="number" min="0" max="900" value="${e.rest}"></div><div><label>Movement pattern</label><input class="field" id="ep" value="${esc(e.pattern)}"></div></div><label>Instructions</label><textarea class="field" id="ei" rows="3">${esc(e.instructions)}</textarea><button class="btn primary full" onclick="saveExercise('${id}',${i})">Save exercise</button><button class="btn ghost full" onclick="editDay('${id}')">Back</button>`)}
function saveExercise(id,i){let d=db.days.find(x=>x.id===id),e=d.ex[i],name=$('#en').value.trim(),sets=+$('#es').value,rest=+$('#et').value;if(!name||!Number.isInteger(sets)||sets<1||sets>12||rest<0||rest>900)return alert('Check name, sets (1–12), and rest (0–900).');snapshot();Object.assign(e,{name,sets,rest,reps:$('#er').value.trim()||'8–12',pattern:$('#ep').value.trim()||'Custom',instructions:$('#ei').value.trim()});save();editDay(id)}

// Session timing is independent of the rest timer and persists in the workout draft.
function ensureTiming(d){if(!d.timing||!Number.isFinite(d.timing.startedAt)){d.timing={startedAt:Date.parse(d.date)||Date.now(),pausedAt:null,pausedMs:0};save()}}
function sessionElapsed(d){if(!d?.timing)return 0;let t=d.timing;return Math.max(0,(t.pausedAt||Date.now())-t.startedAt-(t.pausedMs||0))}
function durationText(ms){if(!Number.isFinite(ms))return 'Not tracked';let sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m ${String(s).padStart(2,'0')}s`}
function sessionClock(ms){let sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function sessionBar(){if(db.settings.sessionTimer===false)return '';let d=db.draft;ensureTiming(d);return `<div class="session-head"><div><div class="eyebrow">SESSION DURATION</div><button class="session-pill" onclick="sessionExpanded=!sessionExpanded;workout()"><span class="pulse-dot"></span><strong id="session-clock">${sessionClock(sessionElapsed(d))}</strong><span class="muted">${d.timing.pausedAt?'PAUSED':'ELAPSED'} ▾</span></button></div>${sessionExpanded?`<div class="actions"><button class="btn slim" onclick="toggleSession()">${d.timing.pausedAt?'Resume':'Pause'}</button><button class="btn slim ghost" onclick="resetSession()">Reset</button></div>`:''}</div>`}
function toggleSession(){let t=db.draft?.timing;if(!t)return;if(t.pausedAt){t.pausedMs+=Date.now()-t.pausedAt;t.pausedAt=null}else t.pausedAt=Date.now();save();workout()}
function resetSession(){if(!db.draft||!confirm('Reset this workout duration to zero? Logged sets will not be affected.'))return;db.draft.timing={startedAt:Date.now(),pausedAt:null,pausedMs:0};save();workout()}
function summary(id){let l=db.logs.find(x=>x.id===id)||db.logs.at(-1);if(!l){go('progress');return}page='summary';lastSavedLog=l.id;let completed=l.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done&&!s.missed).length,0),missed=l.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.missed).length,0);let totalVolume=l.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done&&!s.missed).reduce((a,s)=>a+(Number(s.weight)||0)*(Number(s.reps)||0),0),0);shell('MISSION COMPLETE','SESSION REPORT',`<section class="panel hero"><div class="eyebrow">${esc(l.dayName)} · ${displayWorkoutDate(l)}</div><h1>${durationText(l.timing?.durationMs)}</h1><p class="muted small">Total active training time</p><div class="summary-grid"><div><b>${completed}</b><small>Completed sets</small></div><div><b>${missed}</b><small>Missed targets</small></div><div><b>${l.exercises.length}</b><small>Exercises</small></div></div><p class="muted small">Logged weight × reps: ${Math.round(totalVolume).toLocaleString()} lb (weighted sets only)</p></section><h2>Session breakdown</h2>${l.exercises.map(e=>`<section class="panel compact"><b>${esc(e.name)}</b><div class="muted small">${e.sets.map(s=>s.done?(s.missed?'Missed':`${s.weight||'BW'} × ${s.reps||0}`):'Skipped').join(' · ')}</div></section>`).join('')}<button class="btn ghost full" onclick="editLogDate('${l.id}')">Edit workout date</button><button class="btn primary full" onclick="go('progress')">View all history</button>`);window.scrollTo(0,0)}
function swapDecision(l){let items=l.swaps||[];modal(`<div class="eyebrow">SAVE YOUR CHANGES?</div><h2>Keep these swaps?</h2><p class="muted">Your completed session is already saved. Do you want to change the original workout program for next time?</p>${items.map(x=>`<div class="panel compact"><b>${esc(x.original)}</b><div class="muted small">→ ${esc(x.replacement)}</div></div>`).join('')}<button class="btn primary full" onclick="persistSwaps('${l.id}')">Update my workout plan</button><button class="btn ghost full" onclick="closeModal()">Just for today</button>`)}
function persistSwaps(id){let l=db.logs.find(x=>x.id===id),day=db.days.find(x=>x.id===l?.dayId);if(!l||!day)return closeModal();snapshot();for(let x of l.swaps||[]){let e=day.ex.find(e=>e.id===x.exerciseId);if(e&&e.name===x.original){let ne=makeEx(x.replacement);Object.assign(e,{name:ne.name,pattern:ne.pattern,muscle:ne.muscle,reps:ne.reps,rest:ne.rest,instructions:ne.instructions})}}save();closeModal();toast('Workout plan updated')}

// Skill trees: mastery is a user confirmation, never inferred from workout logs alone.
const SKILL_TREES=[
 {id:'pull',title:'PULL-UP',subtitle:'From assisted pulling to strict control',nodes:[
  ['hang','Active Hang','Hold an active shoulder position for 20 seconds.','Pull-Ups',null],
  ['scap','Scapular Pull-Ups','Complete 8 controlled scapular reps.','Pull-Ups','hang'],
  ['negative','Controlled Negatives','Complete 3 controlled descents of about 5 seconds.','Assisted Pull-Ups','scap'],
  ['strict','First Strict Pull-Up','Complete 1 full strict pull-up.','Pull-Ups','negative'],
  ['five','Five Strict Pull-Ups','Complete 5 strict reps in one set.','Pull-Ups','strict'],
  ['ten','Ten Strict Pull-Ups','Complete 10 strict reps in one set.','Pull-Ups','five']]},
 {id:'dip',title:'DIP',subtitle:'Support strength and controlled pressing',nodes:[
  ['support','Support Hold','Hold a stable support position for 20 seconds.','Dips',null],
  ['assisted','Assisted Dips','Complete 8 controlled assisted dips.','Dips','support'],
  ['negative','Negative Dips','Complete 3 slow, pain-free descents.','Dips','assisted'],
  ['strict','First Strict Dip','Complete 1 controlled strict dip.','Dips','negative'],
  ['five','Five Strict Dips','Complete 5 controlled strict dips.','Dips','strict']]},
 {id:'lsit',title:'L-SIT',subtitle:'Core compression and straight-leg holds',nodes:[
  ['tuck','Tuck Support','Hold a supported tuck for 15 seconds.','Dead Bug',null],
  ['oneleg','Single-Leg Extension','Hold one leg extended for 10 seconds each side.','Dead Bug','tuck'],
  ['advanced','Advanced Tuck Hold','Hold an advanced tuck for 15 seconds.','Dead Bug','oneleg'],
  ['lsit','Full L-Sit','Hold a full L-sit for 5 seconds.','Dead Bug','advanced'],
  ['ten','Ten-Second L-Sit','Hold a full L-sit for 10 seconds.','Dead Bug','lsit']]},
 {id:'muscle',title:'MUSCLE-UP',subtitle:'Pulling power, transition and support',nodes:[
  ['pull','Strong Pulling Base','Demonstrate 5 strict pull-ups.','Pull-Ups',null],
  ['dip','Strong Dip Base','Demonstrate 5 strict dips.','Dips','pull'],
  ['high','High Pull-Up','Pull explosively toward lower chest height with control.','Pull-Ups','dip'],
  ['transition','Assisted Transition','Complete a smooth, controlled assisted transition.','Assisted Pull-Ups','high'],
  ['muscle','First Muscle-Up','Complete one controlled muscle-up without excessive swinging.','Pull-Ups','transition']]}
];
let selectedTree='pull',selectedSkill=null;

function matrixFigure(tree){
 const poses={
 pull:{bar:32,head:[120,51],shoulder:[120,75],hip:[120,116],hands:[[73,32],[167,32]],elbows:[[91,56],[149,56]],knees:[[105,145],[135,145]],feet:[[98,163],[142,163]],equipment:'PULL-UP BAR'},
 dip:{bar:98,head:[120,35],shoulder:[120,62],hip:[120,106],hands:[[73,98],[167,98]],elbows:[[92,90],[148,90]],knees:[[105,139],[135,139]],feet:[[100,160],[140,160]],equipment:'PARALLEL BARS'},
 lsit:{bar:140,head:[92,40],shoulder:[92,67],hip:[92,107],hands:[[63,136],[121,136]],elbows:[[69,103],[115,103]],knees:[[141,109],[171,109]],feet:[[186,109],[207,109]],equipment:'L-SIT SUPPORT'},
 muscle:{bar:72,head:[120,28],shoulder:[120,54],hip:[120,100],hands:[[75,72],[165,72]],elbows:[[93,69],[147,69]],knees:[[106,134],[134,134]],feet:[[99,157],[141,157]],equipment:'BAR TRANSITION'}
 };const a=poses[tree]||poses.pull;
 const line=(x,y,X,Y,w=7)=>`<path d="M${x} ${y}L${X} ${Y}" stroke="url(#bodyLight)" stroke-width="${w}" stroke-linecap="round"/>`;
 const limb=(pts)=>pts.slice(1).map((q,i)=>line(pts[i][0],pts[i][1],q[0],q[1])).join('');
 const [hx,hy]=a.head,[sx,sy]=a.shoulder,[px,py]=a.hip;
 const torso=`<path d="M${sx-18} ${sy-6} Q${sx} ${sy-15} ${sx+18} ${sy-6} L${px+11} ${py-7} Q${px} ${py+5} ${px-11} ${py-7}Z" fill="url(#torsoFill)" stroke="#80f1ff" stroke-width="1.5"/><path d="M${sx} ${sy+1}V${py-9} M${sx-15} ${sy+13}Q${sx} ${sy+22} ${sx+15} ${sy+13} M${sx-12} ${sy+32}H${sx+12}" stroke="#63e2f5" stroke-width="1" opacity=".65" fill="none"/>`;
 return `<svg viewBox="0 0 240 185" role="img" aria-label="Holographic ${tree} movement pose schematic"><defs><linearGradient id="bodyLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9bf7ff"/><stop offset=".55" stop-color="#3bcde8"/><stop offset="1" stop-color="#19708d"/></linearGradient><linearGradient id="torsoFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17677e" stop-opacity=".8"/><stop offset="1" stop-color="#04131f" stop-opacity=".85"/></linearGradient><filter id="holoAura"><feGaussianBlur stdDeviation="3"/></filter></defs><path d="M25 88H215 M120 5V175" stroke="#50cfe6" stroke-width=".6" stroke-dasharray="3 8" opacity=".3"/><ellipse cx="120" cy="95" rx="63" ry="78" fill="#16bbeb" opacity=".08" filter="url(#holoAura)"/><path d="M44 ${a.bar}H196" stroke="#3ee1ff" stroke-width="3" opacity=".75"/>${tree==='dip'?`<path d="M44 98H85 M155 98H196" stroke="#b0faff" stroke-width="5"/>`:''}${limb([[sx-16,sy],a.elbows[0],a.hands[0]])}${limb([[sx+16,sy],a.elbows[1],a.hands[1]])}${limb([[px-7,py],a.knees[0],a.feet[0]])}${limb([[px+7,py],a.knees[1],a.feet[1]])}${torso}<ellipse cx="${hx}" cy="${hy}" rx="12" ry="15" fill="url(#torsoFill)" stroke="#a1f5ff" stroke-width="2"/><path d="M${hx-8} ${hy+2}Q${hx} ${hy+7} ${hx+8} ${hy+2}" fill="none" stroke="#71d7ec" stroke-width=".8"/>${[...a.hands,...a.elbows,...a.knees].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#a5fbff"/>`).join('')}<text x="120" y="181" text-anchor="middle" fill="#77dbea" font-size="7" letter-spacing="2">${a.equipment} // HOLOGRAM</text></svg>`
}

const skillKey=(tree,node)=>tree+':'+node;
function skillMastered(tree,node){return !!db.skills?.[skillKey(tree,node)]}
function skillPrereq(tree,node){return !node[4]||skillMastered(tree,node[4])}
function skillExerciseEvidence(name){let logs=db.logs.filter(l=>l.exercises?.some(e=>e.name===name&&e.sets?.some(s=>s.done&&!s.missed)));return logs.length}
const SKILL_COLORS={pull:'#35dfff',dip:'#b96cff',lsit:'#64fba0',muscle:'#55b8ff'};
function skillArt(tree){return `<img src="skill-${tree}.webp" alt="Illustrated athlete performing ${tree==='pull'?'a pull-up':tree==='dip'?'a dip':tree==='lsit'?'an L-sit':'a muscle-up'}" loading="lazy">`}
function skills(){let t=SKILL_TREES.find(t=>t.id===selectedTree)||SKILL_TREES[0],count=t.nodes.filter(n=>skillMastered(t.id,n[0])).length;
 shell('SKILL MATRIX','CALISTHENICS',`<section class="skill-banner"><div class="eyebrow">PHOENIX // ABILITY PROGRESSION</div><h2 style="margin-top:8px">Unlock your potential</h2><p class="muted small">Choose a path. You confirm mastery only after actually completing each requirement.</p><div class="skill-meter"><div class="progress"><i style="width:${Math.round(count/t.nodes.length*100)}%"></i></div><span>${count}/${t.nodes.length} mastered</span></div></section><div class="skill-gallery" aria-label="Choose a calisthenics skill tree">${SKILL_TREES.map(x=>{let n=x.nodes.filter(k=>skillMastered(x.id,k[0])).length;return `<button class="skill-art-card ${x.id===t.id?'chosen':''} skill-${x.id}" onclick="selectTree('${x.id}')" aria-pressed="${x.id===t.id}"><span class="skill-card-image">${skillArt(x.id)}</span><span class="skill-card-body"><strong>${esc(x.title)}</strong><small>${esc(x.subtitle)}</small><span class="skill-card-progress">${n} / ${x.nodes.length} MASTERED <span aria-hidden="true">›</span></span></span></button>`}).join('')}</div><section class="tree-stage"><div class="matrix-title"><div class="eyebrow">${esc(t.title)} // PROGRESSION PATH</div><p class="muted small">${esc(t.subtitle)}</p></div><div class="matrix-art illustrated">${skillArt(t.id)}<span class="matrix-art-label">${esc(t.title)} // MOVEMENT ARTWORK</span></div><div class="tree-path">${t.nodes.map((n,i)=>{let mastered=skillMastered(t.id,n[0]),available=skillPrereq(t.id,n);return `<button class="skill-node ${mastered?'mastered':available?'available':''}" onclick="showSkill('${t.id}','${n[0]}')"><span class="skill-symbol">${mastered?'✓':available?'◇':'⌑'}</span><div class="status">${mastered?'MASTERED':available?'READY TO VERIFY':'LOCKED'}</div><b>${esc(n[1])}</b><small>${esc(n[2])}</small></button>`}).join('')}</div></section><p class="caption">Illustrated athletes are visual inspiration, not step-by-step technique demonstrations. Skill completion is always manually confirmed.</p>`);
}
function selectTree(id){selectedTree=id;skills()}
function showSkill(treeId,nodeId){let t=SKILL_TREES.find(x=>x.id===treeId),n=t?.nodes.find(x=>x[0]===nodeId);if(!n)return;let mastered=skillMastered(treeId,nodeId),available=skillPrereq(treeId,n),prereq=n[4]?t.nodes.find(x=>x[0]===n[4]):null,evidence=skillExerciseEvidence(n[3]);
 modal(`<div class="eyebrow">SKILL DETAILS // ${esc(t.title)}</div><h2>${esc(n[1])}</h2><div class="skill-modal-art illustrated">${skillArt(treeId)}</div><p>${esc(n[2])}</p><div class="panel compact"><div class="eyebrow">TRAINING SIGNAL</div><p class="small muted">${evidence} completed workout session${evidence===1?'':'s'} containing ${esc(n[3])}. This is supporting context, not proof of mastery.</p></div>${!available?`<div class="skill-warning">First confirm: ${esc(prereq?.[1]||'prerequisite skill')}.</div>`:mastered?'<div class="note">You marked this skill as mastered.</div>':'<div class="note">Eligible to verify. Confirm only after you have actually performed the requirement with control.</div>'}<div class="actions" style="margin-top:14px">${mastered?`<button class="btn danger full" onclick="unmasterSkill('${treeId}','${nodeId}')">Undo mastery</button>`:available?`<button class="btn primary full" onclick="masterSkill('${treeId}','${nodeId}')">I completed this skill</button>`:''}<button class="btn ghost full" onclick="closeModal()">Close</button></div>`)
}
function masterSkill(tree,node){let t=SKILL_TREES.find(x=>x.id===tree),n=t?.nodes.find(x=>x[0]===node);if(!n||!skillPrereq(tree,n))return toast('Prerequisite not yet mastered');if(!confirm('Confirm you completed '+n[1]+' with proper form?'))return;db.skills[skillKey(tree,node)]={date:new Date().toISOString()};if(!save()){delete db.skills[skillKey(tree,node)];return}closeModal();skills();toast('SKILL UNLOCKED · '+n[1]);}
function unmasterSkill(tree,node){let t=SKILL_TREES.find(x=>x.id===tree),index=t?.nodes.findIndex(n=>n[0]===node);if(index<0)return;let dependent=t.nodes.slice(index+1).filter(n=>skillMastered(tree,n[0]));if(!confirm('Undo this mastery'+(dependent.length?' and '+dependent.length+' dependent unlock(s)':'')+'?'))return;delete db.skills[skillKey(tree,node)];for(let n of dependent)delete db.skills[skillKey(tree,n[0])];save();closeModal();skills();toast('Mastery updated')}

setInterval(()=>{let el=$('#session-clock');if(el&&db.draft){el.textContent=sessionClock(sessionElapsed(db.draft))}},500);

if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
